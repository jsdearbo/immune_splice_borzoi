# =============================================================================
# Example configuration for immune_splice_borzoi fine-tuning pipeline
# =============================================================================
#
# This file is the single source of truth for a training run. Pass it to
# 00_fine_tune.py with: python scripts/00_fine_tune.py --config <this_file>
#
# Required before running:
#   - Generate NPZ shards from Imm_cell_rMATS pipeline and set target_tsv_base_path
#   - Set train_params.devices to match your available GPUs
#   - Set train_params.save_dir to a local output directory
# =============================================================================

# W&B project and run name (used for logging and checkpoint naming)
project: "my_project"
name: "my_run_name"

# Path to the directory containing train/val NPZ shard manifests (TSV files).
# Generated by the Imm_cell_rMATS labeling pipeline.
# For multitask: point to a directory containing all cell-type shards.
# For single cell type: point to the per-cell-type subdirectory.
target_tsv_base_path: "/path/to/labelled_data/multitask_balanced"

# Cell types to train on. Order matters: index 0 → task 0, etc.
# For single-cell-type training, list only one entry.
cell_types: ["B_Cell", "Macrophage", "T_Cell"]


# =============================================================================
# Model architecture
# =============================================================================
model_params:
  model_type: "BorzoiModel"

  # --- LoRA fine-tuning (attention layers) ---
  use_lora: True               # Enable LoRA adapters on transformer attention
  lora_rank: 8                 # LoRA rank (higher = more capacity, more params)

  # --- LoCon fine-tuning (conv tower) ---
  conv_select: 4               # Apply LoCon to the last N conv tower blocks (0 = disabled)
  locon_rank: 4                # LoCon rank per block
  locon_alpha: 1.0             # LoCon scale = alpha / rank

  # --- Output head architecture ---
  # Use split_head for multitask models (separate per-task projections after shared trunk).
  # Use nonlinear_head: True, split_head: False for a simple shared nonlinear head.
  # Use conditional_head: True for a single-output head conditioned on cell_type embedding.
  nonlinear_head: True
  split_head: True
  conditional_head: False
  head_hidden: 256             # Shared trunk hidden dim
  task_hidden: 512             # Per-task projection hidden dim (split_head only)

  # --- Input / output windowing ---
  crop_len: 5120               # Crop the center N bins of Borzoi's output for loss computation
                               # (reduces memory; 5120 bins = 163,840 bp at 32 bp/bin)
  final_pool_func: "identity"
  final_act_func: "linear"


# =============================================================================
# Training parameters
# =============================================================================
train_params:
  task: "multilabel"           # "multilabel" for PSI regression (soft [0,1] targets)
  loss: "strongpsiloss"        # See utils/losses.py for available loss classes

  optimizer: "adamw"
  batch_size: 2                # Per-GPU batch size; effective batch = batch_size × n_GPUs
  max_epochs: 30

  devices: [0]                 # GPU device index or list for multi-GPU, e.g. [0, 1]
  accelerator: "gpu"
  precision: "bf16-mixed"      # "bf16-mixed" recommended for NVIDIA Ampere+ GPUs
  num_workers: 16

  # Learning rates: head is typically tuned 10–50× higher than the backbone.
  lr: 6.5e-6                   # LoRA / LoCon adapter learning rate
  head_lr: 1.25e-4             # Output head learning rate
  weight_decay: 5.5e-5
  adam_beta1: 0.9
  adam_beta2: 0.999

  warmup_steps: 350            # Linear LR warmup before cosine decay begins
  clip: 0.25                   # Gradient clip norm
  cosine_decay: true           # Cosine LR decay after warmup
  cosine_T_epochs: 3           # Fix cosine period to N epochs; LR plateaus at min_lr_ratio
                               # after this many epochs even if training continues longer
  early_stopping_patience: 5   # Stop if monitored metric does not improve for N epochs

  save_dir: "/path/to/output"  # Root directory for checkpoint saving

  # --- Loss hyperparameters ---
  loss_params:
    psi_params:
      # StrongPSILoss: pointwise BCE + cell-type specialization + PSI profile shape matching
      lambda_mid: 25.0          # Upweight events with intermediate PSI (0.1 < PSI < 0.9)
      alpha_cell: 3.15          # Cell-type specialization loss weight (0 = disable)
      beta_profile: 0.0165      # PSI profile shape loss weight (Bhattacharyya; 0 = disable)
      gamma_pointwise: 0.0      # Additional pointwise loss multiplier (set 0 if not needed)
      eps: 1.0e-6
      use_mask: True            # Apply coverage mask from NPZ to exclude unreliable bins
      pointwise_mode: "logit"   # "logit" (logit-space MSE) or "bce" (standard BCE)

  # --- Checkpoint saving ---
  checkpoint:
    monitor: "val_cell_loss"   # Metric to monitor for best checkpoint selection
    mode: "min"                # "min" for loss metrics, "max" for Pearson / AUC
    save_last: true            # Always save the last checkpoint in addition to best
    save_top_k: 1              # How many best checkpoints to retain
