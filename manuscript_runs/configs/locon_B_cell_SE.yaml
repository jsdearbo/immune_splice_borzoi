experiment_dir: "/mnt/data_sda/jdearborn/scratch/JD_build/interpretation/attribution/runs/locon_B_cell_SE"  # /path/to/attribution_runs/locon_B_cell_SE
coord_file_path: "/mnt/data_sda/jdearborn/scratch/JD_build/interpretation/attribution/runs/locon_B_cell_SE/events.csv"  # or: manuscript_runs/event_tables/B_cell_SE_events.csv
species: "mouse"
model_selection: "fine_tuned"
checkpoint_path: "/mnt/data_sda/jdearborn/scratch/T_and_B_cells/experiments/20260511_single_cell_types_locon4/B_cell/checkpoints/epoch=2-step=13089.ckpt"  # /path/to/checkpoints/B_cell_locon_v1.ckpt (download from Zenodo)
centering_mode: "element_only"
attr_respect_to: "element_only"
attribution_method: "inputxgradient"
name_col: "unique_ID"

mask_mode: "element_only"
flank: [100]
modisco_len: 1000
