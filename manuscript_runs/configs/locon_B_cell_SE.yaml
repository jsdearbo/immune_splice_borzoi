  gtf_file: "/mnt/data_sda/jdearborn/genomes/mouse/mm10/gtf/gencode.vM23.annotation.gtf"  # /path/to/mm10/gtf/gencode.vM23.annotation.gtf
  flank: 100
  modisco_window: 1000
  attr_respect_to: "element_only"
  y_scale: "log1p"
