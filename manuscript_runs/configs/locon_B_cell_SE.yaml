  comparisons:
    - {primary: "high_psi",         control: "low_psi"}
    - {primary: "intermediate_psi", control: "low_psi"}
    - {primary: "high_psi",         control: "intermediate_psi"}
    - {primary: "high_psi",         control: "rest"}
    - {primary: "intermediate_psi", control: "rest"}
    - {primary: "low_psi",          control: "rest"}

dedupe_overlaps: true
task_id: ""
genome_name: "/mnt/data_sda/jdearborn/genomes/mouse/mm10/fasta/GRCm38.primary_assembly.genome.fa"  # /path/to/mm10/fasta/GRCm38.primary_assembly.genome.fa

motif_mapping:
